[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "index-advisor"
version = "0.1.0"
description = "Review SQL Server index usage and get keep, drop and consolidate recommendations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Avery Lane"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
sqlserver = ["pyodbc>=4.0.30"]

[tool.setuptools.packages.find]
include = ["index_advisor*"]
